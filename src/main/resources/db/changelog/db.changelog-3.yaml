databaseChangeLog:
  - changeSet:
      id: create-table-message
      author: tammy-xu
      changes:
        - createTable:
            tableName: message
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: message_pkey
              - column:
                  name: interview_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    foreignKeyName: fk_message_interview
                    deleteCascade: true
                    referencedTableName: interview
                    referencedColumnNames: id
              - column:
                  name: instructions
                  type: VARCHAR
              - column:
                  name: input
                  type: VARCHAR
